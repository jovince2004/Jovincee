<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <style type="text/tailwindcss">
        @custom-variant dark (&:where(.dark, .dark * ));

        @theme {
            --color-main: #92EEFF;
            --color-secondary: #30AFFF;
            --color-accent: #C4F7CA;

            --color-dark-main: #091413;
            --color-dark-secondary: #408A71;
            --color-dark-accent: #B0E4CC;
        }

        @layer base {
            .body-theme {
                @apply bg-main text-center text-white dark:bg-dark-main;
            }
        }

        @layer components {
            .btn-primary {
                @apply rounded-xl bg-accent px-6 py-3 font-semibold text-dark-main transition-colors hover:opacity-80 dark:bg-dark-accent dark:text-white;
            }

            .btn-secondary {
                @apply rounded-3xl bg-secondary p-8 text-dark-main dark:bg-dark-secondary dark:text-white;
                box-shadow: 8px 8px 18px #17647b, -8px -8px 18px #2fa7c1;
            }

            .dark .btn-secondary {
                box-shadow: 8px 8px 18px #080808, -8px -8px 18px #303b50;
            }

            .section-title {
                @apply mb-3 text-2xl font-bold text-main dark:text-dark-accent;
            }

            .btn-accent {
                @apply transition-colors duration-300 hover:text-accent dark:hover:text-dark-accent;
            }
        }
    </style>
</head>

<body class="body-theme">
    <header class="border border-main/20 bg-secondary p-10 dark:border-white/10 dark:bg-dark-secondary">
        <h1 class="mb-5 pt-5 text-3xl font-bold italic text-main underline dark:text-dark-accent">
            Jovince
        </h1>

        <nav class="flex justify-between ms-20 me-20">
            <span>@jovince2004</span>
            <ul class="flex gap-10">
                <li><a href="#about" class="btn-accent">About</a></li>
                <li><a href="#services" class="btn-accent">Services</a></li>
                <li><a href="#contact" class="btn-accent">Contact Me</a></li>
            </ul>
        </nav>
    </header>

    <button id="toggledark" class="btn-primary m-4">Toggle</button>

    <main class="mx-auto max-w-5xl space-y-8 p-8">
        <section id="projects" class="btn-secondary">
            <p class="font-semibold text-main dark:text-dark-accent">Hello, Si Jovince Ni</p>
            <h2 class="my-3 text-4xl font-bold">Welcome Sa Akon Website</h2>
            <a href="#contact" class="btn-primary">Contact Me</a>
        </section>

        <section id="about" class="btn-secondary">
            <h2 class="section-title">About Me</h2>
            <p>Ako ni.</p>
        </section>

        <section id="services" class="btn-secondary">
            <h2 class="section-title">Services</h2>
            <p>Ano imo sir?</p>
        </section>

        <section id="contact" class="btn-secondary">
            <h2 class="section-title">Contact</h2>
            <p>Panawag lang</p>
        </section>
    </main>

    <script>
        const toggleButton = document.querySelector("#toggledark");
        const html = document.documentElement;
        toggleButton.addEventListener("click", function () {
            html.classList.toggle("dark");
        });
    </script>

    <footer class="border-2 border-main/20 bg-secondary p-10 dark:border-white/10 dark:bg-dark-secondary">
        <h2 class="mt-5 pb-5 pt-5 text-3xl font-bold italic text-main underline dark:text-dark-accent">
            !!Perpek nani Sir!!
        </h2>
    </footer>
</body>

</html>
